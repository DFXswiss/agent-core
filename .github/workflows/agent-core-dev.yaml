name: agent-core DEV

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE: dfxswiss/agent-core
  TAG: beta

jobs:
  build-and-push:
    name: Build and push Docker image (DEV)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ github.sha }}
          platforms: linux/arm64

      - name: Notify image publish endpoint
        if: github.event_name == 'push'
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          digest_re='^sha256:[0-9a-f]{64}$'
          if [[ ! "${IMAGE_DIGEST}" =~ ${digest_re} ]]; then
            echo "::error::image digest is missing or malformed"
            exit 1
          fi
          audience='https://image-published.dfxserve.com/v1/image-published'
          oidc_token="$(curl --silent --fail \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" \
            | jq -er '.value' 2>/dev/null)" || {
            echo "::error::failed to request identity token"
            exit 1
          }
          if [ -z "${oidc_token}" ]; then
            echo "::error::failed to request identity token"
            exit 1
          fi
          body="$(jq -nc --arg image "${IMAGE}" --arg tag "${TAG}" --arg digest "${IMAGE_DIGEST}" '{image:$image,tag:$tag,digest:$digest}')"
          http_code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            --data "${body}" \
            "${audience}")" || {
            echo "::error::image publish request failed"
            exit 1
          }
          case "${http_code}" in
            2[0-9][0-9]) ;;
            *)
              echo "::error::image publish request failed"
              exit 1
              ;;
          esac

      - name: Notify infrastructure to pull :beta
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ secrets.DISPATCH_REPO }}"
          if [ -z "${GH_TOKEN}" ] || [ -z "${repo}" ]; then
            echo "::warning::DISPATCH_TOKEN or DISPATCH_REPO unset — set them like the other product image repos"
            exit 0
          fi
          gh api "repos/${repo}/dispatches" \
            -f event_type=image-published \
            -f "client_payload[image]=${IMAGE}" \
            -f "client_payload[tag]=${TAG}" \
            -f "client_payload[sha]=${GITHUB_SHA}"
